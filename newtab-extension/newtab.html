<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumina</title>
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>

  <!-- 粒子画布 -->
  <canvas id="particle-canvas"></canvas>

  <!-- 动态背景光晕 -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- 主内容 -->
  <main class="main-content">

    <!-- 顶部：时间 + 问候 -->
    <section class="hero">
      <div class="clock-wrapper">
        <div class="clock" id="clock">00:00</div>
        <div class="date" id="date-display">加载中...</div>
      </div>
      <div class="greeting" id="greeting">你好！</div>
    </section>

    <!-- 搜索栏 -->
    <section class="search-section">
      <div class="search-container glass-card">
        <button class="engine-btn" id="engine-btn" title="切换搜索引擎">
          <span class="engine-icon" id="engine-icon">G</span>
        </button>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="搜索，或输入网址…"
          autocomplete="off"
          autofocus
        />
        <button class="search-submit" id="search-submit" title="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
      <!-- 搜索历史浮层 -->
      <div class="search-history glass-card" id="search-history" hidden>
        <div class="sh-header">
          <span class="sh-title">搜索历史</span>
          <button class="sh-clear" id="sh-clear" title="清空全部历史">清空</button>
        </div>
        <ul class="sh-list" id="sh-list"></ul>
      </div>
      <!-- 引擎选择浮层 -->
      <div class="engine-picker glass-card" id="engine-picker">
        <button class="ep-item" data-engine="google">
          <span class="ep-badge ep-google">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24Z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15Z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98Z"/>
            </svg>
          </span>
          <span>Google</span>
        </button>
        <button class="ep-item" data-engine="bing">
          <span class="ep-badge ep-bing">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="#008373" d="M5 2.5v17.2l5.3 3.3 8.2-4.6v-5.8l-5.8-2.1v-3.8l-7.7-4.2z"/>
              <path fill="#00B294" d="M10.3 8.3l5.9 3.1v3.9l-5.9 3.3V8.3z"/>
              <path fill="#43D6B5" opacity="0.7" d="M10.3 18.6l5.9-3.3v-3.9l-5.9 3.3v3.9z"/>
            </svg>
          </span>
          <span>Bing</span>
        </button>
        <button class="ep-item" data-engine="baidu">
          <span class="ep-badge ep-baidu">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <ellipse cx="6.5" cy="7.8" rx="2" ry="2.7" fill="#2932E1" transform="rotate(-20 6.5 7.8)"/>
              <ellipse cx="17.5" cy="7.8" rx="2" ry="2.7" fill="#2932E1" transform="rotate(20 17.5 7.8)"/>
              <ellipse cx="10.2" cy="4.8" rx="1.8" ry="2.5" fill="#2932E1" transform="rotate(-6 10.2 4.8)"/>
              <ellipse cx="13.8" cy="4.8" rx="1.8" ry="2.5" fill="#2932E1" transform="rotate(6 13.8 4.8)"/>
              <path fill="#DE0F17" d="M12 8.4c-3.6 0-5.8 2.3-5.8 5.2 0 2.7 1.7 4.9 4.2 5.5.6.1 1 .6 1.1 1.2.1.7.7 1.2 1.5 1.2.8 0 1.4-.5 1.5-1.2.1-.6.5-1.1 1.1-1.2 2.5-.6 4.2-2.8 4.2-5.5 0-2.9-2.2-5.2-5.8-5.2h-2z"/>
              <path fill="#FFFFFF" d="M9.8 11.5h4.4v1.4H9.8zm.8 2.4h2.8v1.3h-2.8z"/>
            </svg>
          </span>
          <span>百度</span>
        </button>
        <button class="ep-item" data-engine="duckduckgo">
          <span class="ep-badge ep-duckduckgo">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <circle cx="12" cy="12" r="10.5" fill="#DE5833"/>
              <path fill="#FFFFFF" d="M15.4 12.2c-.2-.1-.5-.2-.7-.2-.2-.5-.6-1-1.1-1.3.3-.4.5-.9.5-1.4 0-1.5-1.2-2.7-2.7-2.7-.4 0-.8.1-1.2.3-.2-.5-.7-.9-1.3-.9-1 0-1.7.9-1.5 1.9l.4 1.7c-.4.4-.7.9-.7 1.5 0 .9.6 1.7 1.4 1.9v1.2c0 .6.5 1.1 1.1 1.1h3.6c.6 0 1.1-.5 1.1-1.1v-.8c.7-.2 1.2-.8 1.2-1.5 0-.5-.3-1-.6-1.2z"/>
              <circle cx="10.2" cy="8.2" r=".7" fill="#2E3440"/>
              <path fill="#F59E0B" d="M14.5 11c.8 0 1.5-.4 1.8-1-.5-.2-1.1-.3-1.8-.3v1.3z"/>
              <path fill="#10B981" d="M11 13.5h2.5v1.2H11z"/>
            </svg>
          </span>
          <span>DuckDuckGo</span>
        </button>
      </div>
    </section>

    <!-- 快捷方式网格 -->
    <section class="shortcuts-section">
      <div class="shortcuts-grid" id="shortcuts-grid">
        <!-- 由 JS 动态渲染 -->
      </div>
      <button class="add-shortcut-btn glass-card" id="add-btn" title="添加快捷方式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>添加</span>
      </button>
    </section>

  </main>

  <!-- 底部工具栏 -->
  <footer class="footer">
    <div class="footer-left">
      <span id="weather-placeholder" class="weather-pill glass-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
          <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        晴朗
      </span>
    </div>
    <div class="footer-right">
      <button class="footer-btn glass-card" id="settings-btn" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </footer>

  <!-- 添加快捷方式弹窗 -->
  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal glass-card">
      <h3 class="modal-title">添加快捷方式</h3>
      <label>
        <span>名称</span>
        <input type="text" id="shortcut-name" placeholder="例：GitHub" maxlength="20" />
      </label>
      <label>
        <span>网址</span>
        <input type="url" id="shortcut-url" placeholder="https://github.com" />
      </label>
      <div class="modal-actions">
        <button class="btn-cancel" id="modal-cancel">取消</button>
        <button class="btn-confirm" id="modal-confirm">添加</button>
      </div>
    </div>
  </div>

  <!-- 快捷方式右键上下文菜单 -->
  <div class="context-menu glass-card" id="context-menu" hidden>
    <button class="ctx-item" id="ctx-open-new">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      <span>在新标签页打开</span>
    </button>
    <button class="ctx-item" id="ctx-copy-url">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span>复制链接</span>
    </button>
    <button class="ctx-item" id="ctx-refresh-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      <span>重新获取图标</span>
    </button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" id="ctx-edit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span>编辑快捷方式</span>
    </button>
    <button class="ctx-item ctx-danger" id="ctx-delete">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      <span>删除</span>
    </button>
  </div>

  <!-- 设置面板弹窗 -->
  <div class="modal-overlay" id="settings-overlay" hidden>
    <div class="modal glass-card settings-modal">
      <div class="settings-header">
        <h3 class="modal-title">设置 & 数据备份</h3>
        <button class="settings-close-btn" id="settings-close" title="关闭">&times;</button>
      </div>

      <!-- 云同步卡片 -->
      <div class="settings-section glass-subcard">
        <div class="settings-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
          <span>云端账号同步</span>
          <span class="sync-badge" id="sync-status-badge">已启用</span>
        </div>
        <p class="settings-desc" id="sync-provider-desc">
          基于浏览器账号（Microsoft Edge / Google Chrome）原生同步服务，数据随您的浏览器账号跨设备自动实时同步。
        </p>
        <div class="settings-btn-row">
          <button class="sub-btn" id="btn-sync-now">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
            <span>立即同步云端</span>
          </button>
        </div>
      </div>

      <!-- 本地文件备份与恢复 -->
      <div class="settings-section glass-subcard">
        <div class="settings-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span>本地文件备份</span>
        </div>
        <p class="settings-desc">
          将所有快捷方式和设置打包导出为 JSON 备份文件，或从备份文件导入还原。
        </p>
        <div class="settings-btn-row">
          <button class="sub-btn" id="btn-export-backup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span>导出备份文件</span>
          </button>
          <button class="sub-btn" id="btn-import-backup">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span>恢复备份文件</span>
          </button>
          <input type="file" id="import-file-input" accept=".json" hidden />
        </div>
      </div>

      <!-- 危险区域：重置 -->
      <div class="settings-section glass-subcard danger-subcard">
        <div class="settings-section-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          <span>重置预设</span>
        </div>
        <p class="settings-desc">
          清除自定义快捷方式并重置为初始推荐列表。
        </p>
        <div class="settings-btn-row">
          <button class="sub-btn btn-danger-soft" id="btn-reset-default">
            <span>重置为默认配置</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 轻量 Toast 提示 -->
  <div class="toast glass-card" id="toast" hidden>
    <span class="toast-icon" id="toast-icon">✓</span>
    <span class="toast-message" id="toast-msg">操作成功</span>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
