<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c6fef"/>
      <stop offset="100%" stop-color="#43c6d5"/>
    </linearGradient>
    <radialGradient id="glow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#grad)"/>
  <rect width="128" height="128" rx="28" fill="url(#glow)"/>
  <!-- 中心大星圆 -->
  <circle cx="64" cy="54" r="22" fill="none" stroke="white" stroke-width="5" opacity="0.9"/>
  <circle cx="64" cy="54" r="7" fill="white" opacity="0.95"/>
  <!-- 光芒 8 条 -->
  <g stroke="white" stroke-linecap="round" opacity="0.7">
    <line x1="64" y1="16" x2="64" y2="26" stroke-width="4.5"/>
    <line x1="64" y1="82" x2="64" y2="92" stroke-width="4.5"/>
    <line x1="26" y1="54" x2="36" y2="54" stroke-width="4.5"/>
    <line x1="92" y1="54" x2="102" y2="54" stroke-width="4.5"/>
    <line x1="35.5" y1="23.5" x2="42.5" y2="30.5" stroke-width="3.5"/>
    <line x1="85.5" y1="77.5" x2="92.5" y2="84.5" stroke-width="3.5"/>
    <line x1="92.5" y1="23.5" x2="85.5" y2="30.5" stroke-width="3.5"/>
    <line x1="42.5" y1="77.5" x2="35.5" y2="84.5" stroke-width="3.5"/>
  </g>
  <!-- 底部品牌栏 -->
  <rect x="30" y="104" width="68" height="8" rx="4" fill="white" opacity="0.35"/>
  <rect x="44" y="116" width="40" height="5" rx="2.5" fill="white" opacity="0.2"/>
</svg>
