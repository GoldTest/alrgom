[package]
name = "traceable-conv-rng"
version = "0.1.0"
edition = "2021"

[lib]
name = "traceable_conv_rng"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rng-server"
path = "src/main.rs"

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"


